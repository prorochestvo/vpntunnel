# Public edge vhost for the vpntunnel API, fronted by Cloudflare (proxied).
#
# Request path:
#   client --TLS--> Cloudflare (edge cert) --TLS--> this vhost (:443)
#          --loopback https--> 127.0.0.1:8888 (vpntunnel API, self-signed)
#
# The API stays bound to loopback; nginx is the only public entry point.
#
# Operator-managed prerequisites (NOT shipped from the repo):
#   - /etc/nginx/certificates/cloudflare/seilbekskindirov.dev.pem  Cloudflare Origin Certificate
#   - /etc/nginx/certificates/cloudflare/seilbekskindirov.dev.key  its private key (mode 0600)
#   - /etc/nginx/certificates/cloudflare/origin-pull-ca.pem        fetched by `make deploy-nginx`
#
# Cloudflare side: DNS A record `vpntunnel` proxied (orange), SSL/TLS mode
# Full (strict), and Authenticated Origin Pulls enabled for the zone.
#
# Origin certificate renewal (the .pem/.key above):
#   The Cloudflare Origin Certificate is issued for 15 years and is trusted only
#   by Cloudflare, so it never needs ACME-style auto-renewal. To rotate it (on
#   expiry, key compromise, or revocation): Cloudflare dashboard -> SSL/TLS ->
#   Origin Server -> Create Certificate (hostnames *.seilbekskindirov.dev and
#   seilbekskindirov.dev), overwrite the two files above with the new PEM/key,
#   then rerun `make deploy-nginx`. No DNS or Cloudflare-mode change is needed.

server {
    listen 80;
    listen [::]:80;
    server_name vpntunnel.seilbekskindirov.dev;

    access_log /var/log/nginx/dev.seilbekskindirov.vpntunnel.access.log;
    error_log /var/log/nginx/dev.seilbekskindirov.vpntunnel.error.log;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vpntunnel.seilbekskindirov.dev;

    access_log /var/log/nginx/dev.seilbekskindirov.vpntunnel.access.log;
    error_log /var/log/nginx/dev.seilbekskindirov.vpntunnel.error.log;

    ssl_certificate     /etc/nginx/certificates/cloudflare/seilbekskindirov.dev.pem;
    ssl_certificate_key /etc/nginx/certificates/cloudflare/seilbekskindirov.dev.key;

    # Authenticated Origin Pulls: only accept connections that present
    # Cloudflare's client certificate. This blocks direct-to-IP access that
    # would otherwise bypass the Cloudflare edge. Scoped to this vhost only —
    # the other domains on :443 are untouched.
    ssl_client_certificate /etc/nginx/certificates/cloudflare/origin-pull-ca.pem;
    ssl_verify_client      on;

    # cap request bodies in line with the API's max_request_body_bytes (10 MiB).
    client_max_body_size 10m;

    location / {
        # the API serves a self-signed cert on loopback; verification is off
        # because there is nothing to trust and the hop never leaves the host.
        proxy_pass            https://127.0.0.1:8888;
        proxy_ssl_verify      off;
        proxy_ssl_server_name on;
        proxy_ssl_name        localhost;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxied upstream requests can be long-lived; do not buffer responses.
        proxy_read_timeout 300s;
        proxy_buffering     off;
    }
}

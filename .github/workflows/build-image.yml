# Reusable image-build workflow — shared by staging.yml and release.yml.
#
# Called via:
#   uses: ./.github/workflows/build-image.yml
#   with:
#     image_tags: |
#       main-abc1234
#       edge
#
# IMPORTANT: image_tags must be newline-joined (YAML block scalar "|"), NOT
# comma-joined. docker/metadata-action expects newlines; a comma ends up as a
# literal tag name with a comma in it, which the registry rejects.
#
# The first tag in image_tags becomes the primary immutable tag surfaced through
# the image_tag output (via steps.meta.outputs.version). Callers must pass the
# immutable tag first (e.g. main-<sha> before edge; 1.2.3 before latest).
#
# Lint + test are handled by the caller (staging / release). This workflow
# trusts the caller and only builds + publishes.
name: build-image
on:
  workflow_call:
    inputs:
      image_tags:
        description: >
          Newline-joined list of image tags to publish. The first tag is the
          primary (immutable) one returned as the image_tag output.
        type: string
        required: true
    outputs:
      image_tag:
        description: >
          Primary immutable image tag (e.g. main-abc1234 for a main push,
          or 1.2.3 for a v1.2.3 tag push). Matches the first entry in image_tags.
        value: ${{ jobs.publish.outputs.image_tag }}

# Serializes concurrent builds for the same ref. Cancel-in-progress is false
# so a rapid tag push does not cancel a build halfway through. Staging callers
# that want supersession on main should set their own concurrency group.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/httpproxy
          # tags input is newline-joined; pass through verbatim from caller.
          # All tags are type=raw so this workflow never injects its own semver
          # patterns — tag computation lives entirely in the caller.
          tags: ${{ inputs.image_tags }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: configs/httpproxy.distroless.go1.26.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance and sbom are intentionally disabled — they add manifest
          # entries that distroless tooling sometimes chokes on.
          provenance: false
          sbom: false
